<div
    class="pm-modal"
    id="modalPersonal"
    aria-hidden="true"
    data-url-admin="/admin/usuarios/administradores"
data-url-recepcion="/admin/usuarios/recepcionistas"
>
    <div class="pm-modal__fondo" data-modal-fondo></div>

    <section
        class="pm-modal__ventana"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pmTitulo"
        aria-describedby="pmDescripcion"
        tabindex="-1"
    >
        <header class="pm-modal__encabezado">
            <span class="pm-modal__icono" aria-hidden="true">♙</span>

            <h2 id="pmTitulo">Crear usuario</h2>

            <p id="pmDescripcion">
                Registra una nueva cuenta para el personal del hotel.
            </p>
        </header>

        <div class="pm-modal__contenido">
            <form id="formCrearPersonal" novalidate>
                <div
                    id="pmMensajeFormulario"
                    class="pm-mensaje-formulario"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <div class="pm-campo">
                    <label for="pmRol">Tipo de cuenta *</label>

                    <div class="pm-select-contenedor">
                        <span aria-hidden="true" class="pm-select-icono">♙</span>

                        <select id="pmRol" name="rol_id" required>
                            <option value="" selected disabled>
                                Selecciona el tipo de cuenta
                            </option>
                            <option value="1">Administrador</option>
                            <option value="2">Recepcionista</option>
                        </select>
                    </div>
                </div>

                <div class="pm-campos-dobles">
                    <div class="pm-campo">
                        <label for="pmNombre">Nombre *</label>
                        <input
                            type="text"
                            id="pmNombre"
                            name="nombre"
                            placeholder="Nombre"
                            maxlength="100"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <div class="pm-campo">
                        <label for="pmApellidos">Apellidos *</label>
                        <input
                            type="text"
                            id="pmApellidos"
                            name="apellidos"
                            placeholder="Apellidos"
                            maxlength="150"
                            autocomplete="family-name"
                            required
                        >
                    </div>
                </div>

                <div class="pm-campo">
                    <label for="pmEmail">Correo electrónico *</label>
                    <input
                        type="email"
                        id="pmEmail"
                        name="email"
                        placeholder="usuario@maisonhotel.com"
                        maxlength="150"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="pm-campo">
                    <label for="pmTelefono">Teléfono *</label>
                    <input
                        type="tel"
                        id="pmTelefono"
                        name="telefono"
                        placeholder="Número de teléfono"
                        maxlength="25"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="pm-campo">
                    <label for="pmPassword">Contraseña *</label>

                    <div class="pm-password-contenedor">
                        <input
                            type="password"
                            id="pmPassword"
                            name="password"
                            placeholder="Crea una contraseña segura"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            aria-describedby="pmAyudaPassword"
                            required
                        >

                        <button
                            type="button"
                            class="pm-ver-password"
                            data-toggle-password="pmPassword"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >
                            <span aria-hidden="true">◉</span>
                        </button>
                    </div>

                    <p id="pmAyudaPassword" class="pm-ayuda">
                        Mínimo 8 caracteres, con mayúscula, minúscula,
                        número y símbolo.
                    </p>

                    <div
                        class="pm-seguridad-password"
                        id="pmSeguridadPassword"
                        aria-live="polite"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p id="pmEstadoPassword" class="pm-ayuda">
                        Escribe una contraseña segura.
                    </p>
                </div>

                <div class="pm-campo">
                    <label for="pmConfirmarPassword">
                        Confirmar contraseña *
                    </label>

                    <div class="pm-password-contenedor">
                        <input
                            type="password"
                            id="pmConfirmarPassword"
                            name="confirmar_password"
                            placeholder="Repite la contraseña"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="pm-ver-password"
                            data-toggle-password="pmConfirmarPassword"
                            aria-label="Mostrar confirmación de contraseña"
                            aria-pressed="false"
                        >
                            <span aria-hidden="true">◉</span>
                        </button>
                    </div>
                </div>

                <div class="pm-modal__acciones">
                    <button
                        type="button"
                        class="pm-btn pm-btn--cancelar"
                        data-modal-cerrar
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="pm-btn pm-btn--guardar"
                        id="pmBtnGuardar"
                    >
                        <span class="pm-btn__texto">Crear usuario</span>
                        <span
                            class="pm-btn__cargando"
                            aria-hidden="true"
                            hidden
                        ></span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</div>

<div
    id="pmToastRegion"
    class="pm-toast-region"
    aria-live="polite"
    aria-atomic="true"
></div>
